name: Build Android APK
on:
  push:
    branches: [max-ai-advisor-android]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Locate Android SDK on runner
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          ls -la "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" || true
      - name: Install Android SDK 35
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          MANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager | head -1)"
          test -n "$MANAGER" || exit 1
          yes | "$MANAGER" --licenses >/dev/null || true
          "$MANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle --no-daemon -p max-ai-advisor :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MaxAIAdvisor-debug-apk
          path: max-ai-advisor/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
